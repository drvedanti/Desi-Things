["Dhenki","Assam","Food · Body · Work",{"en":"When making rice was also physical work.","mr":"भात बनवणे हे शारीरिक कामही होते.","hi":"चावल बनाना शारीरिक श्रम भी था."},"Rice was traditionally pounded using a foot-operated wooden device. The task combined repetition, coordination, posture and food preparation.","It was ordinary household work, not an exercise routine.","Research has measured the physical workload and postural demands of rice pounding.","Mechanised milling reduced time and physical labour."],
["Jata / stone grinding","India","Food · Body · Technology",{"en":"A kitchen task that quietly contained movement, skill and time.","mr":"स्वयंपाकघरातील असे काम ज्यात हालचाल, कौशल्य आणि वेळ दडलेला होता.","hi":"रसोई का ऐसा काम जिसमें गति, कौशल और समय शामिल था."},"Grains and spices could be ground by hand using stone tools.","The body supplied force; skill involved pressure, rhythm and control.","Research describes grinding and pounding becoming less labour-intensive with mechanisation.","Electric grinders compressed a slow task into a short machine-assisted step."],
["Infant massage + songs","India","Care · Body · Family",{"en":"Care was also touch, movement and language.","mr":"काळजी म्हणजे स्पर्श, हालचाल आणि भाषाही होती.","hi":"देखभाल में स्पर्श, गतिविधि और भाषा भी शामिल थे."},"Infant massage could be combined with gentle movement, songs and naming body parts.","Touch, movement, sound and caregiver attention happened together.","Research documents infant massage practices; individual health claims need separate evidence.","Modern childcare routines vary and may separate these elements."],
["The courtyard","India","Home · Climate · Community",{"en":"The house itself could participate in everyday comfort.","mr":"घराची रचना स्वतःच दैनंदिन आरामात सहभागी होऊ शकत होती.","hi":"घर की बनावट खुद रोज़मर्रा के आराम में भूमिका निभा सकती थी."},"Courtyard homes used shade, openings and materials to shape the indoor environment.","Air movement, solar exposure, thermal mass and behaviour interact.","Indian studies have measured environmental differences between courtyard houses and modern apartments.","Modern housing often uses different layouts and mechanical cooling."],
["Idli fermentation","South India","Food · Microbes · Time",{"en":"“Leave it overnight” was a process you couldn't see.","mr":"“रात्रभर ठेव” म्हणजे दिसत नसलेली प्रक्रिया.","hi":"“रातभर छोड़ दें” एक ऐसी प्रक्रिया थी जिसे देखा नहीं जा सकता था."},"Rice-and-lentil batter was left to ferment before cooking.","Microbial communities change over time; research has tracked this succession.","The microbial process is researchable; wider health claims need separate evidence.","Commercial products, refrigeration and faster routines can change fermentation."],
["Mising food preservation","Assam","Food · Ecology · Community",{"en":"A pantry designed around season, place and survival.","mr":"ऋतू, प्रदेश आणि जगण्याभोवती तयार केलेली साठवण पद्धत.","hi":"मौसम, जगह और जीवन-यापन के हिसाब से बनी खाद्य-संरक्षण व्यवस्था."},"Drying, smoking and salting formed a community-specific preservation system.","Moisture, salt and smoke change conditions for spoilage.","Research documents these practices among the Mising community.","Refrigeration and commercial food systems changed preservation routines."],
["Chhathi / Chatti","Bihar / North India","Ritual · Birth · Community",{"en":"A family event can also be a system for organizing care and meaning.","mr":"कौटुंबिक विधी काळजी आणि अर्थव्यवस्था मांडण्याची पद्धतही असू शकतो.","hi":"पारिवारिक आयोजन देखभाल और अर्थ को व्यवस्थित करने की एक प्रणाली भी हो सकता है."},"The sixth-day birth ritual brings family and community into shared practices and beliefs.","People gather, roles are organized and a new family member is symbolically introduced.","Documented as a community ritual; cultural meaning is distinct from biomedical claims.","Migration and changing family structures can alter the form."],
["Menstrual knowledge between generations","India","Body · Women · Knowledge",{"en":"Who taught you what your body meant?","mr":"तुमच्या शरीराचा अर्थ तुम्हाला कोणी शिकवला?","hi":"आपके शरीर का अर्थ आपको किसने सिखाया?"},"Girls and women have learned menstrual practices through mothers, relatives, peers and community knowledge.","Knowledge carries language, norms, comfort, stigma and practical routines.","Indian studies document intergenerational transmission and changing practices.","School education, digital media and products alter how knowledge travels."],
["Khasi plant doctors","Meghalaya","Community · Health knowledge",{"en":"What counts as a healthcare practitioner depends on the knowledge system.","mr":"आरोग्यसेवा देणारा कोण मानला जातो हे ज्ञानपद्धतीवर अवलंबून असते.","hi":"किसे स्वास्थ्य-सेवा देने वाला माना जाए, यह ज्ञान-व्यवस्था पर निर्भर करता है."},"Traditional practitioners work with plant-based knowledge and identify as local plant doctors.","Knowledge is organized socially: who knows, who teaches, who seeks help.","Ethnographic research documents Khasi plant doctors and their knowledge system.","This archive does not validate treatment claims."],
["Madurai plant-drug market","Madurai, Tamil Nadu","Community · Healthcare · Market",{"en":"Healthcare knowledge can live inside a market.","mr":"आरोग्याचे ज्ञान बाजारपेठेतही जगू शकते.","hi":"स्वास्थ्य का ज्ञान बाज़ार के भीतर भी मौजूद हो सकता है."},"Researchers documented weekly market shops where families supplied plant materials and prescriptions.","The market connected practitioners, knowledge, materials and people seeking help.","Published ethnobotanical research documented the market and medicinal plant trade.","This is a system story, not treatment advice."],
["Matka water","India","Home · Material · Climate",{"en":"An everyday object that uses material and climate together.","mr":"सामान्य वस्तू जी पदार्थ आणि हवामान यांचा एकत्र उपयोग करते.","hi":"एक रोज़मर्रा की वस्तु जो सामग्री और जलवायु को साथ इस्तेमाल करती है."},"Unglazed earthen pots were used to store and cool water.","Porous clay and evaporation interact with the surrounding environment.","The cooling mechanism is basic physical science; health claims need separate evidence.","Refrigerators changed many storage routines."],
["What disappears when memory isn't recorded?","Across India","Knowledge · Language · Memory",{"en":"Some knowledge exists only because someone remembers it.","mr":"काही ज्ञान टिकते कारण कोणीतरी ते आठवून ठेवते.","hi":"कुछ ज्ञान इसलिए मौजूद रहता है क्योंकि कोई उसे याद रखता है."},"Household and local practices can travel through oral teaching, language and repeated doing.","When a practice stops being repeated, context can disappear faster than the object.","Research on local health traditions discusses loss of oral/community knowledge.","A digital archive can preserve fragments while keeping context visible."]

"Jata / stone grinding":{
mr:["धान्य आणि मसाले दगडी साधनांनी हाताने दळले जात. या कामात हाताने जोर देणे, ताल आणि नियंत्रण आवश्यक होते.","शरीरातून शक्ती येत असे; कौशल्यात दाब, ताल आणि नियंत्रणाचा समावेश होता.","यांत्रिकीकरणामुळे दळणे आणि कांडणे कमी श्रमाचे झाले असे संशोधनात वर्णन आहे.","इलेक्ट्रिक ग्राइंडरने दीर्घ काम काही मिनिटांच्या मशीन-सहाय्यित कामात बदलले."],
hi:["अनाज और मसाले पत्थर के औज़ारों से हाथ से पीसे जाते थे। इसमें दबाव, लय और नियंत्रण का कौशल शामिल था.","शरीर बल देता था; कौशल में दबाव, लय और नियंत्रण शामिल थे.","शोध में बताया गया है कि मशीनीकरण से पीसने और कूटने का श्रम कम हुआ.","इलेक्ट्रिक ग्राइंडर ने लंबे काम को कम समय के मशीन-सहायित काम में बदल दिया."]
},
"Infant massage + songs":{
mr:["बाळाला मालिश करताना हलकी हालचाल, गाणी आणि शरीराच्या भागांची नावे सांगणे यांचा समावेश होऊ शकतो.","स्पर्श, हालचाल, आवाज आणि काळजी घेणाऱ्याचे लक्ष एकत्र येत होते.","भारतातील बालमालिश पद्धतींचे संशोधनात दस्तऐवजीकरण झाले आहे; वैयक्तिक आरोग्यदाव्यांसाठी स्वतंत्र पुरावे आवश्यक आहेत.","आजच्या बालसंगोपनाच्या पद्धती वेगळ्या असू शकतात आणि हे घटक वेगवेगळे केले जाऊ शकतात."],
hi:["शिशु की मालिश में हल्की गतिविधि, गीत और शरीर के अंगों के नाम लेना शामिल हो सकता था.","स्पर्श, गतिविधि, आवाज़ और देखभाल करने वाले का ध्यान साथ आते थे.","भारत में शिशु मालिश की प्रथाओं का दस्तावेज़ीकरण हुआ है; व्यक्तिगत स्वास्थ्य दावों के लिए अलग प्रमाण चाहिए.","आज की बाल-देखभाल दिनचर्याएँ अलग हो सकती हैं और इन तत्वों को अलग-अलग कर सकती हैं."]
},
"The courtyard":{
mr:["अंगण असलेल्या घरांमध्ये सावली, उघडी जागा आणि बांधकामातील पदार्थांचा वापर करून घरातील वातावरण घडवले जात असे.","हवेची हालचाल, सूर्यप्रकाश, उष्णता साठवणारी सामग्री आणि मानवी वर्तन यांचा परस्पर संबंध असतो.","भारतीय अभ्यासांमध्ये अंगणाच्या घरांमध्ये आणि आधुनिक अपार्टमेंटमध्ये पर्यावरणीय फरक मोजले गेले आहेत.","आधुनिक घरांमध्ये वेगळी रचना आणि यांत्रिक थंडकरण वापरले जाते."],
hi:["आंगन वाले घर छाया, खुले हिस्से और निर्माण सामग्री से अंदर का वातावरण प्रभावित करते थे.","हवा की गति, धूप, ऊष्मीय द्रव्यमान और मानव व्यवहार एक-दूसरे से जुड़े हैं.","भारतीय अध्ययनों ने आंगन वाले घरों और आधुनिक अपार्टमेंट के पर्यावरणीय अंतर को मापा है.","आधुनिक घरों में अलग योजनाएँ और यांत्रिक शीतलन आम हैं."]
},
"Idli fermentation":{
mr:["तांदूळ आणि डाळीचे पीठ शिजवण्यापूर्वी आंबवण्यासाठी ठेवले जात असे.","सूक्ष्मजीवांचे समुदाय वेळेनुसार बदलतात; या बदलांचा अभ्यास झाला आहे.","सूक्ष्मजीव प्रक्रिया संशोधनातून समजता येते; व्यापक आरोग्यदाव्यांसाठी स्वतंत्र पुरावे आवश्यक आहेत.","व्यावसायिक उत्पादने, रेफ्रिजरेशन आणि जलद दिनचर्यांमुळे आंबवण्याची पद्धत बदलू शकते."],
hi:["चावल और दाल के घोल को पकाने से पहले किण्वन के लिए रखा जाता था.","सूक्ष्मजीव समुदाय समय के साथ बदलते हैं; इस क्रम का अध्ययन किया गया है.","सूक्ष्मजीव प्रक्रिया का अध्ययन किया जा सकता है; व्यापक स्वास्थ्य दावों के लिए अलग प्रमाण चाहिए.","व्यावसायिक उत्पाद, रेफ्रिजरेशन और तेज़ दिनचर्याएँ किण्वन को बदल सकती हैं."]
},
"Mising food preservation":{
mr:["वाळवणे, धुरी देणे आणि मीठ वापरणे ही समुदायाशी संबंधित अन्नसाठवण पद्धती होती.","ओलावा, मीठ आणि धूर खराब होण्याच्या परिस्थितींवर परिणाम करतात.","मिसिंग समुदायातील या पद्धतींचे अलीकडील संशोधनात दस्तऐवजीकरण झाले आहे.","रेफ्रिजरेशन आणि व्यावसायिक अन्नव्यवस्थेमुळे साठवणुकीच्या पद्धती बदलल्या."],
hi:["सुखाना, धुआँ देना और नमक लगाना समुदाय-विशिष्ट खाद्य संरक्षण की पद्धतियाँ थीं.","नमी, नमक और धुआँ खराब होने की परिस्थितियों को बदलते हैं.","मिसिंग समुदाय में इन प्रथाओं का शोध में दस्तावेज़ीकरण हुआ है.","रेफ्रिजरेशन और व्यावसायिक खाद्य प्रणालियों ने संरक्षण की दिनचर्या बदली."]
},
"Chhathi / Chatti":{
mr:["जन्मानंतरचा सहाव्या दिवसाचा विधी कुटुंब आणि समुदायाला सामायिक पद्धती व विश्वासांमध्ये एकत्र आणतो.","लोक एकत्र येतात, भूमिका ठरतात आणि नव्या कुटुंबसदस्याचे प्रतीकात्मक स्वागत केले जाते.","हा समुदायाचा विधी म्हणून दस्तऐवजीकृत आहे; त्याचा सांस्कृतिक अर्थ जैववैद्यकीय दाव्यांपेक्षा वेगळा आहे.","स्थलांतर आणि बदलत्या कुटुंबरचनेमुळे त्याचे स्वरूप बदलू शकते."],
hi:["जन्म के छठे दिन का अनुष्ठान परिवार और समुदाय को साझा प्रथाओं और विश्वासों में जोड़ता है.","लोग इकट्ठा होते हैं, भूमिकाएँ तय होती हैं और नए सदस्य का प्रतीकात्मक स्वागत होता है.","इसे सामुदायिक अनुष्ठान के रूप में दर्ज किया गया है; इसका सांस्कृतिक अर्थ जैव-चिकित्सीय दावों से अलग है.","प्रवास और बदलती पारिवारिक संरचनाएँ इसका रूप बदल सकती हैं."]
},
"Menstrual knowledge between generations":{
mr:["मुली आणि स्त्रिया मासिक पाळीशी संबंधित पद्धती आई, नातेवाईक, मैत्रिणी आणि समुदायाच्या ज्ञानातून शिकतात.","ज्ञानामध्ये भाषा, नियम, आराम, कलंक आणि दैनंदिन पद्धतींचा समावेश असतो.","भारतीय अभ्यासांमध्ये पिढ्यान्‌पिढ्या ज्ञान हस्तांतरण आणि बदलत्या पद्धतींचे दस्तऐवजीकरण आहे.","शालेय शिक्षण, डिजिटल माध्यमे आणि उत्पादने ज्ञानाचा प्रवास बदलतात."],
hi:["लड़कियाँ और महिलाएँ मासिक धर्म से जुड़ी प्रथाएँ माताओं, रिश्तेदारों, साथियों और समुदाय से सीखती हैं.","ज्ञान में भाषा, नियम, सहजता, कलंक और व्यावहारिक दिनचर्याएँ शामिल होती हैं.","भारतीय अध्ययनों में पीढ़ियों के बीच ज्ञान के हस्तांतरण और बदलती प्रथाओं का दस्तावेज़ीकरण हुआ है.","स्कूली शिक्षा, डिजिटल मीडिया और उत्पाद ज्ञान के प्रवाह को बदलते हैं."]
},
"Khasi plant doctors":{
mr:["पारंपरिक वैद्य वनस्पतींशी संबंधित ज्ञान वापरतात आणि स्थानिक पातळीवर वनस्पती-वैद्य म्हणून ओळखले जाऊ शकतात.","कोण जाणते, कोण शिकवते आणि कोण मदत घेतो यानुसार ज्ञानाची सामाजिक रचना होते.","खासी वनस्पती-वैद्य आणि त्यांच्या ज्ञानपद्धतीचे मानववंशशास्त्रीय संशोधनात दस्तऐवजीकरण आहे.","हा संग्रह उपचारांच्या दाव्यांना वैध ठरवत नाही."],
hi:["पारंपरिक चिकित्सक पौधों से जुड़े ज्ञान के साथ काम करते हैं और स्थानीय पौधा-चिकित्सक के रूप में पहचाने जा सकते हैं.","ज्ञान सामाजिक रूप से व्यवस्थित होता है: कौन जानता है, कौन सिखाता है और कौन मदद लेता है.","खासी पौधा-चिकित्सकों और उनकी ज्ञान-व्यवस्था का नृवंशविज्ञान में दस्तावेज़ीकरण हुआ है.","यह संग्रह उपचार के दावों को प्रमाणित नहीं करता."]
},
"Madurai plant-drug market":{
mr:["संशोधकांनी साप्ताहिक बाजारातील दुकानांचे दस्तऐवजीकरण केले, जिथे कुटुंबे वनस्पतीजन्य पदार्थ आणि उपचारांच्या सूचना देत.","बाजाराने जाणकार, ज्ञान, साहित्य आणि मदत शोधणारे लोक यांना जोडले.","प्रकाशित एथ्नोबॉटॅनिकल संशोधनात या बाजारपेठेचे आणि वनस्पती व्यापाराचे दस्तऐवजीकरण झाले आहे.","ही आरोग्यव्यवस्थेची कथा आहे; उपचाराचा सल्ला नाही."],
hi:["शोधकर्ताओं ने साप्ताहिक बाज़ार की दुकानों का दस्तावेज़ीकरण किया, जहाँ परिवार पौधों की सामग्री और उपयोग-संबंधी निर्देश देते थे.","बाज़ार ने जानकारों, ज्ञान, सामग्री और मदद खोजने वाले लोगों को जोड़ा.","प्रकाशित एथ्नोबॉटैनिकल शोध में इस बाज़ार और पौधों के व्यापार का दस्तावेज़ीकरण हुआ है.","यह एक प्रणाली की कहानी है, उपचार की सलाह नहीं."]
},
"Matka water":{
mr:["न चमकवलेल्या मातीच्या मडक्यांचा वापर पाणी साठवण्यासाठी आणि थंड ठेवण्यासाठी केला जात असे.","मातीची छिद्रयुक्त रचना आणि बाष्पीभवन आसपासच्या वातावरणाशी परस्परसंवाद करतात.","थंड होण्याची प्रक्रिया मूलभूत भौतिकशास्त्रातून समजावता येते; आरोग्यदाव्यांसाठी स्वतंत्र पुरावे आवश्यक आहेत.","रेफ्रिजरेटरमुळे पाणी साठवण्याच्या अनेक दिनचर्या बदलल्या."],
hi:["बिना चमकाई गई मिट्टी के घड़ों का उपयोग पानी रखने और ठंडा करने के लिए किया जाता था.","छिद्रयुक्त मिट्टी और वाष्पीकरण आसपास के वातावरण से परस्पर क्रिया करते हैं.","ठंडक की प्रक्रिया बुनियादी भौतिकी से समझी जा सकती है; स्वास्थ्य दावों के लिए अलग प्रमाण चाहिए.","रेफ्रिजरेटर ने पानी रखने की कई दिनचर्याएँ बदल दीं."]
},
"What disappears when memory isn't recorded?":{
mr:["घरगुती आणि स्थानिक पद्धती मौखिक शिकवण, भाषा आणि वारंवार केलेल्या कृतींमधून पुढे जातात.","एखादी पद्धत करणे थांबले की तिचा संदर्भ वस्तूपेक्षा लवकर हरवू शकतो.","स्थानिक आरोग्यपरंपरांवरील संशोधनात मौखिक आणि समुदायाधारित ज्ञान हरवण्याबद्दल चर्चा आहे.","डिजिटल संग्रह तुकडे जतन करू शकतो आणि त्यांचा संदर्भ दृश्यमान ठेवू शकतो."],
hi:["घरेलू और स्थानीय प्रथाएँ मौखिक शिक्षा, भाषा और बार-बार करने से आगे बढ़ती हैं.","जब कोई प्रथा दोहराई नहीं जाती, तो उसका संदर्भ वस्तु से भी तेज़ी से गायब हो सकता है.","स्थानीय स्वास्थ्य परंपराओं पर शोध मौखिक और समुदाय-आधारित ज्ञान के खोने पर चर्चा करता है.","डिजिटल संग्रह अंशों को सुरक्षित रखते हुए संदर्भ को दिखाई दे सकता है."]
}
};

const cats={"Food":"Food","Body":"Body","Work":"Work","Care":"Care","Home":"Home","Climate":"Climate","Community":"Community","Technology":"Technology","Microbes":"Microbes","Time":"Time","Ecology":"Ecology","Ritual":"Ritual","Birth":"Birth","Women":"Women","Knowledge":"Knowledge","Health knowledge":"Health knowledge","Healthcare":"Healthcare","Market":"Market","Material":"Material","Language":"Language","Memory":"Memory"};

function t(k){return (I[lang]&&I[lang][k])||I.en[k]||k}
function applyLang(){document.documentElement.lang=lang==="mr"?"mr":lang==="hi"?"hi":"en";document.querySelectorAll("[data-i18n]").forEach(x=>x.textContent=t(x.dataset.i18n));document.querySelectorAll("[data-lang]").forEach(x=>x.classList.toggle("active",x.dataset.lang===lang))}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}

function card(e,i){return `<article class="card" data-entry="${i}"><div><div class="tag">${esc(e[2])}</div><h3>${esc(e[0])}</h3><p>${esc(e[3][lang]||e[3].en)}</p></div><div class="arrow">↗</div></article>`}

function home(){return `<section><div class="eyebrow">DESI THINGS · V1</div><h1>${t("hero")}</h1><p class="lead">${t("heroLead")}</p><div class="actions"><button class="btn" id="exploreBtn">${t("exploreArchive")}</button><button class="btn ghost" id="shareMemoryBtn">${t("shareSomething")}</button></div></section><section><div class="head"><div><div class="eyebrow">${t("start")}</div><h2>${t("startTitle")}</h2></div><p>${t("startText")}</p></div><div class="grid">${d.slice(0,6).map(card).join("")}</div></section>`}

function explore(){return `<section><div class="detail"><button class="back" id="backHome">${t("back")}</button><div class="eyebrow">${t("archive")}</div><h2>${t("archiveTitle")}</h2><p class="lead">${t("archiveLead")}</p><div class="searchbar"><input id="archiveSearch" placeholder="${t("searchPlace")}"><button class="btn" id="archiveSearchBtn">${t("onlineSearch")}</button></div><div id="archiveGrid" class="grid">${d.map(card).join("")}</div></div></section>`}

function entry(i){const e=d[i];const et=ET[e[0]]||{};return `<section><div class="detail"><button class="back" id="backExplore">${t("backArchive")}</button><div class="eyebrow">${esc(e[2])}</div><h1>${esc(e[0])}</h1><div class="pills"><span class="pill">${esc(e[1])}</span></div><p class="lead">${esc(e[3][lang]||e[3].en)}</p><div class="story"><article><div class="tag">THEN</div><h3>${lang==="mr"?"लोक काय करत होते":lang==="hi"?"लोग क्या करते थे":"What people did"}</h3><p>${esc((et[lang]||[e[4],e[5],e[6],e[7]])[0])}</p></article><article><div class="tag">WHY</div><h3>${lang==="mr"?"का महत्त्वाचे होते":lang==="hi"?"क्यों महत्वपूर्ण था":"Why it mattered"}</h3><p>${esc((et[lang]||[e[4],e[5],e[6],e[7]])[1])}</p></article><article><div class="tag">LOOK CLOSER</div><h3>${lang==="mr"?"जवळून पाहा":lang==="hi"?"ध्यान से देखें":"Look closer"}</h3><p>${esc((et[lang]||[e[4],e[5],e[6],e[7]])[2])}</p></article><article><div class="tag">WHAT CHANGED?</div><h3>${lang==="mr"?"काय बदलले?":lang==="hi"?"क्या बदला?":"What changed?"}</h3><p>${esc((et[lang]||[e[4],e[5],e[6],e[7]])[3])}</p></article></div><div class="evidence"><strong>${t("evidence")}</strong><p>${esc((et[lang]||[e[4],e[5],e[6],e[7]])[2])}</p><div class="note">${t("translationRule")} Desi Things is not medical advice.</div></div><div class="actions"><button class="btn ghost" id="researchEntry">${t("searchWeb")}</button></div></div></section>`}

function add(){return `<section><div class="detail"><button class="back" id="backHome">${t("back")}</button><div class="eyebrow">${t("preserve")}</div><h2>${t("memoryTitle")}</h2><p class="lead">${t("memoryLead")}</p><form id="memoryForm"><div class="field"><label>${t("memoryLabel")}</label><textarea id="memory" required placeholder="${t("memoryPlaceholder")}"></textarea></div><div class="field"><label>${t("location")}</label><select id="country"><option value="">${t("selectCountry")}</option><option value="India">India</option></select><select id="state" disabled><option value="">${t("selectState")}</option></select><select id="district" disabled><option value="">${t("selectDistrict")}</option></select><div class="searchbar"><input id="placeSearch" placeholder="${t("searchVillage")}" disabled><button type="button" class="btn ghost" id="placeBtn" disabled>${t("searchPlace")}</button></div><div id="placeResults"></div><input id="manualPlace" placeholder="${t("notSure")}"></div><div class="field"><label>${t("language")}</label><select id="memoryLang"><option value="en">English</option><option value="mr">मराठी</option><option value="hi">हिन्दी</option></select></div><button class="btn" type="submit">${t("organise")}</button></form><div id="out"></div></div></section>`}

function preview(e){e.preventDefault();const mem=document.getElementById("memory").value.trim();const country=document.getElementById("country").value;const state=document.getElementById("state").value;const district=document.getElementById("district").value;const manual=document.getElementById("manualPlace").value.trim();const place=selectedPlace||manual||"";const ml=document.getElementById("memoryLang").value;const suggestion=mem.split(/[.!?]/)[0].slice(0,70)||"Practice name suggestion";document.getElementById("out").innerHTML=`<div class="ai"><div class="eyebrow">${t("organised")}</div><p><span class="status">${t("inProgress")}</span></p><div class="edit-grid"><div class="field"><label>${t("original")}</label><textarea id="editOriginal">${esc(mem)}</textarea></div><div><div class="field"><label>${t("practice")}</label><input id="editPractice" value="${esc(suggestion)}"><div class="note">${t("suggested")} · ${t("edit")}</div></div><div class="field"><label>${t("category")}</label><input id="editCategory" value="Food / Care / Home / Body / Community"><div class="note">${t("suggested")} · ${t("edit")}</div></div></div><div class="field"><label>${t("what")}</label><textarea id="editWhat">${esc(mem)}</textarea></div><div class="field"><label>${t("purpose")}</label><textarea id="editPurpose">${t("noData")}</textarea></div></div><div class="row"><span>${t("location")}</span><strong>${esc([country,state,district,place].filter(Boolean).join(" · "))||t("manual")}</strong></div><div class="row"><span>${t("translation")}</span><strong>${ml==="mr"?"मराठी":ml==="hi"?"हिन्दी":"English"} · ${t("translationRule")}</strong></div><div class="row"><span>${t("evidence")}</span><strong>${t("noData")}</strong></div><div class="row"><span>${t("safety")}</span><strong>${t("noData")}</strong></div><div class="review"><div class="eyebrow">${t("reviewPath")}</div><h3>${t("reviewText")}</h3><div class="row"><span>${t("contributor")}</span><span class="status green">1 · confirm/edit</span></div><div class="row"><span>${t("research")}</span><span class="status">2 · source review</span></div><div class="row"><span>${t("health")}</span><span class="status">3 · only if health/safety claim</span></div><div class="row"><span>${t("culture")}</span><span class="status">4 · when cultural context needs review</span></div><div class="row"><span>${t("curator")}</span><span class="status">5 · publish decision</span></div><p class="note">${t("translationRule")}</p></div><div class="evidence"><strong>${t("sources")}</strong><p>${t("sourcesText")}</p><button type="button" class="btn ghost" id="findSources">${t("findSources")}</button></div><div class="actions"><button type="button" class="btn" id="saveDraft">${t("save")}</button></div></div>`;bindGenerated()}

let selectedPlace="";
function bindLocation(){const country=document.getElementById("country"),state=document.getElementById("state"),district=document.getElementById("district"),pb=document.getElementById("placeBtn"),ps=document.getElementById("placeSearch");if(!country)return;country.onchange=()=>{state.disabled=!country.value;state.innerHTML=`<option value="">${t("selectState")}</option>`;district.innerHTML=`<option value="">${t("selectDistrict")}</option>`;district.disabled=true;ps.disabled=true;pb.disabled=true;if(country.value==="India")locationData.forEach(x=>{const o=document.createElement("option");o.value=x.state;o.textContent=x.state;state.appendChild(o)})};state.onchange=()=>{const s=locationData.find(x=>x.state===state.value);district.innerHTML=`<option value="">${t("selectDistrict")}</option>`;(s?.districts||[]).forEach(dn=>{const o=document.createElement("option");o.value=dn;o.textContent=dn;district.appendChild(o)});district.disabled=!s;ps.disabled=!s;pb.disabled=!s};pb.onclick=searchLocalities;ps.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();searchLocalities()}}}
async function searchLocalities(){const q=document.getElementById("placeSearch").value.trim();const state=document.getElementById("state").value;const district=document.getElementById("district").value;const box=document.getElementById("placeResults");if(!q){box.innerHTML=`<p class="note">${t("searchVillage")}</p>`;return}box.innerHTML="<p class='note'>Searching…</p>";const params=new URLSearchParams({format:"jsonv2",country:"India",q:`${q}, ${district}, ${state}`,limit:"8",addressdetails:"1"});try{const r=await fetch("https://nominatim.openstreetmap.org/search?"+params.toString(),{headers:{"Accept-Language":lang}});const data=await r.json();box.innerHTML=data.length?data.map(x=>`<div class="source"><button type="button" class="ghost" style="border:0;padding:0;text-align:left;width:100%" data-place="${esc(x.display_name)}"><strong>${esc(x.name||q)}</strong><br><span class="note">${esc(x.display_name)}</span></button></div>`).join(""):`<p class="note">${t("notSure")}</p>`;box.querySelectorAll("[data-place]").forEach(b=>b.onclick=()=>{selectedPlace=b.dataset.place;document.getElementById("placeSearch").value=b.textContent.trim();box.innerHTML=`<p class="note">${esc(selectedPlace)}</p>`})}catch(err){box.innerHTML=`<p class="note">${t("notSure")}</p>`}}

function bindGenerated(){document.getElementById("saveDraft")?.addEventListener("click",()=>{localStorage.setItem("desiDraft",document.getElementById("editOriginal")?.value||"");alert(t("draftSaved"))});document.getElementById("findSources")?.addEventListener("click",()=>{const q=encodeURIComponent(document.getElementById("editPractice")?.value||"Desi Things traditional practice");window.open("https://www.google.com/search?q="+q,"_blank")})}

function why(){return `<section><div class="detail"><button class="back" id="backHome">${t("back")}</button><div class="eyebrow">${t("why")}</div><h2>${t("whyTitle")}</h2><p class="lead">${t("whyLead")}</p><div class="story"><article><div class="tag">${t("question")}</div><h3>${t("questionTitle")}</h3><p>${t("questionText")}</p></article><article><div class="tag">${t("rule")}</div><h3>${t("ruleTitle")}</h3><p>${t("ruleText")}</p></article></div><div class="evidence"><div class="tag">${t("connected")}</div><h3>${t("connectedTitle")}</h3><p>${t("connectedText")}</p><button class="btn ghost" id="whySearch">${t("searchWeb")}</button></div></div></section>`}

function bindEvents(){applyLang();document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem("desiLang",lang);render()});document.getElementById("shareBtn")?.addEventListener("click",()=>location.hash="add");document.getElementById("exploreBtn")?.addEventListener("click",()=>location.hash="explore");document.getElementById("shareMemoryBtn")?.addEventListener("click",()=>location.hash="add");document.querySelectorAll("[data-entry]").forEach(x=>x.onclick=()=>location.hash="entry-"+x.dataset.entry);document.getElementById("backHome")?.addEventListener("click",()=>location.hash="home");document.getElementById("backExplore")?.addEventListener("click",()=>location.hash="explore");document.getElementById("memoryForm")?.addEventListener("submit",preview);bindLocation();document.getElementById("researchEntry")?.addEventListener("click",()=>{const e=d[Number(location.hash.split("-")[1])];window.open("https://www.google.com/search?q="+encodeURIComponent(e[0]+" India research"),"_blank")});document.getElementById("whySearch")?.addEventListener("click",()=>window.open("https://www.google.com/search?q="+encodeURIComponent("Indian traditional knowledge ethnographic research evidence"),"_blank"));document.getElementById("archiveSearchBtn")?.addEventListener("click",()=>{const q=document.getElementById("archiveSearch").value.trim();if(q)window.open("https://www.google.com/search?q="+encodeURIComponent(q+" India traditional knowledge"),"_blank")});document.getElementById("archiveSearch")?.addEventListener("input",e=>{const q=e.target.value.toLowerCase();document.getElementById("archiveGrid").innerHTML=d.filter(x=>(x[0]+" "+x[1]+" "+x[2]+" "+x[3].en).toLowerCase().includes(q)).map(card).join("");document.querySelectorAll("[data-entry]").forEach(x=>x.onclick=()=>location.hash="entry-"+x.dataset.entry)})}

async function loadLocations(){try{const r=await fetch("https://raw.githubusercontent.com/KTBsomen/Indian-state-district-json/main/india-states-districts-latest.json");locationData=await r.json()}catch(e){locationData=[]}}

function render(){const h=location.hash.slice(1)||"home";let html=h==="home"?home():h==="explore"?explore():h==="add"?add():h==="why"?why():h.startsWith("entry-")?entry(Number(h.split("-")[1])):home();document.getElementById("app").innerHTML=html;bindEvents()}
window.addEventListener("hashchange",render);
loadLocations().then(render);render();
</script>
</body>
</html>
