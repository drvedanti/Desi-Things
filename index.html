<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desi Things</title>
<style>
:root{--ink:#20231f;--muted:#6d726c;--paper:#f5f1e9;--card:#fffdf8;--line:#ddd6ca;--green:#315b4e;--orange:#c66a3d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 Arial,sans-serif}button{font:inherit;cursor:pointer}
nav{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;background:#f5f1e9ee;z-index:3}.logo{font-size:21px;font-weight:700}.logo b{color:var(--orange)}nav a{color:var(--ink);text-decoration:none;margin:0 12px;font-size:14px}.btn{border:0;border-radius:30px;padding:11px 17px;background:var(--ink);color:#fff}
main{max-width:1120px;margin:auto;padding:65px 6% 100px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--orange);font-weight:700}h1,h2{font-family:Georgia,serif;font-weight:500;line-height:1.05;letter-spacing:-2px}h1{font-size:clamp(46px,7vw,82px);max-width:850px;margin:18px 0}h2{font-size:42px;margin:8px 0 15px}.lead{font-size:18px;color:var(--muted);max-width:700px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}section{margin-top:70px}.head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:22px}.head p{color:var(--muted);max-width:480px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:21px;min-height:205px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}.tag{color:var(--green);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px}.card h3{font-size:20px;margin:9px 0}.card p{color:var(--muted);margin:0}.arrow{text-align:right;font-size:20px}.detail{max-width:850px}.back{background:none;border:0;padding:0;color:var(--muted);margin-bottom:35px}.pills{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.pill{background:#e7eee9;border-radius:20px;padding:6px 10px;font-size:12px}.story{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:35px}.story article{border-top:1px solid var(--line);padding-top:18px}.story h3{font-family:Georgia,serif;font-size:25px;margin:5px 0}.story p{color:#555a54}.evidence,.ai{background:#e9efe9;border-radius:18px;padding:22px;margin-top:30px}.note{font-size:12px;color:var(--muted)}form{max-width:720px}.field{margin:18px 0}.field label{display:block;font-weight:600;margin-bottom:7px}.field input,.field textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);font:inherit}.field textarea{min-height:150px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #d9d1c5;gap:15px}footer{border-top:1px solid var(--line);padding:28px 6%;display:flex;justify-content:space-between;color:var(--muted)}
@media(max-width:750px){nav{padding:0 18px}nav .links{display:none}main{padding:45px 20px 70px}.grid,.story{grid-template-columns:1fr}.head{display:block}h1{letter-spacing:-1.5px}footer{padding:25px 20px;display:block}}
</style></head>
<body>
<nav><a class="logo" href="#home">desi<b>things</b></a><div class="links"><a href="#explore">Explore</a><a href="#why">Why this exists</a></div><button class="btn" onclick="location.hash='add'">+ Share a memory</button></nav>
<main id="app"></main><footer><strong>desi<b style="color:var(--orange)">things</b></strong><span>A living archive of everyday knowledge · V1</span></footer>
<script>
const d=[
["Dhenki","Assam","Food · Body · Work","When making rice was also physical work.","Rice was traditionally pounded using a foot-operated wooden device. The task combined repetition, coordination, posture and food preparation.","It was ordinary household work, not an exercise routine.","Research has measured the physical workload and postural demands of rice pounding.","Mechanised milling reduced time and physical labour."],
["Jata / stone grinding","India","Food · Body · Technology","A kitchen task that quietly contained movement, skill and time.","Grains and spices could be ground by hand using stone tools.","The body supplied force and repeated movement; skill involved pressure, rhythm and control.","Older Indian women have described grinding and pounding becoming less labour-intensive with mechanisation.","Electric grinders compressed a slow task into a short machine-assisted step."],
["Infant massage + songs","India","Care · Body · Family","Care was also touch, movement and language.","Infant massage could be combined with gentle movement, songs and naming body parts.","Touch, movement, sound and caregiver attention happened together.","Research documents infant massage practices in India; individual health claims need separate evidence.","Modern childcare routines vary and may separate these elements."],
["The courtyard","India","Home · Climate · Community","The house itself could participate in everyday comfort.","Courtyard homes used shade, openings and materials to shape the indoor environment.","Air movement, solar exposure, thermal mass and behaviour interact.","Indian studies have measured environmental differences between courtyard houses and modern apartments.","Modern housing often uses different layouts and mechanical cooling."],
["Idli fermentation","South India","Food · Microbes · Time","“Leave it overnight” was a process you couldn't see.","Rice-and-lentil batter was left to ferment before cooking.","Microbial communities change over time; research has tracked this succession.","The microbial process is researchable; wider health claims need separate evidence.","Commercial products, refrigeration and faster routines can change fermentation."],
["Mising food preservation","Assam","Food · Ecology · Community","A pantry designed around season, place and survival.","Drying, smoking and salting formed a community-specific preservation system.","Moisture, salt and smoke change conditions for spoilage.","Recent research documents these practices among the Mising community.","Refrigeration and commercial food systems changed preservation routines."],
["Chhathi / Chatti","Bihar / North India","Ritual · Birth · Community","A family event can also be a system for organizing care and meaning.","The sixth-day birth ritual brings family and community into shared practices and beliefs.","People gather, roles are organized and a new family member is symbolically introduced.","Documented as a community ritual; cultural meaning is distinct from biomedical claims.","Migration and changing family structures can alter the form."],
["Menstrual knowledge between generations","India","Body · Women · Knowledge","Who taught you what your body meant?","Girls and women have learned menstrual practices through mothers, relatives, peers and community knowledge.","Knowledge carries language, norms, comfort, stigma and practical routines.","Indian studies document intergenerational transmission and changing practices.","School education, digital media and products alter how knowledge travels."],
["Khasi plant doctors","Meghalaya","Community · Health knowledge","What counts as a healthcare practitioner depends on the knowledge system.","Traditional practitioners work with plant-based knowledge and identify as local plant doctors.","Knowledge is organized socially: who knows, who teaches, who seeks help.","Ethnographic research documents Khasi plant doctors and their knowledge system.","This archive does not validate treatment claims."],
["Madurai plant-drug market","Madurai, Tamil Nadu","Community · Healthcare · Market","Healthcare knowledge can live inside a market.","Researchers documented weekly market shops where families supplied plant materials and prescriptions.","The market connected practitioners, knowledge, materials and people seeking help.","Published ethnobotanical research documented the market and 133 medicinal plant species.","This is a system story, not treatment advice."],
["Matka water","India","Home · Material · Climate","An everyday object that uses material and climate together.","Unglazed earthen pots were used to store and cool water.","Porous clay and evaporation interact with the surrounding environment.","The cooling mechanism is basic physical science; health claims need separate evidence.","Refrigerators changed many storage routines."],
["What disappears when memory isn't recorded?","Across India","Knowledge · Language · Memory","Some knowledge exists only because someone remembers it.","Household and local practices can travel through oral teaching, language and repeated doing.","When a practice stops being repeated, context can disappear faster than the object.","Research on local health traditions discusses loss of oral/community knowledge.","A digital archive can preserve fragments while keeping context visible."]
];
function card(e,i){return '<article class="card" onclick="location.hash=\'entry-'+i+'\'"><div><div class="tag">'+e[2]+'</div><h3>'+e[0]+'</h3><p>'+e[3]+'</p></div><div class="arrow">↗</div></article>'}
function home(){return '<section><div class="eyebrow">DESI THINGS · V1</div><h1>The things we grew up doing. The stories behind them.</h1><p class="lead">A living archive of everyday Indian knowledge — food, body, home, care and community practices passed between generations.</p><div class="actions"><button class="btn" onclick="location.hash=\'explore\'">Explore the archive →</button><button class="btn ghost" onclick="location.hash=\'add\'">Share something you remember</button></div></section><section><div class="head"><div><div class="eyebrow">START HERE</div><h2>Things we stopped asking why about.</h2></div><p>Not a remedy database. Not “old is better.” We look at what people did, why it mattered, what was happening, and what changed.</p></div><div class="grid">'+d.slice(0,6).map(card).join('')+'</div></section>'}
function explore(){return '<section><div class="detail"><button class="back" onclick="location.hash=\'home\'">← Back</button><div class="eyebrow">THE ARCHIVE</div><h2>Explore Desi Things</h2><p class="lead">Twelve starting points. Each one is a doorway into a larger story.</p></div><div class="grid">'+d.map(card).join('')+'</div></section>'}
function entry(i){let e=d[i];return '<section><div class="detail"><button class="back" onclick="location.hash=\'explore\'">← Back to archive</button><div class="eyebrow">'+e[2]+'</div><h1>'+e[0]+'</h1><div class="pills"><span class="pill">'+e[1]+'</span></div><p class="lead">'+e[3]+'</p><div class="story"><article><div class="tag">THEN</div><h3>What people did</h3><p>'+e[4]+'</p></article><article><div class="tag">WHY</div><h3>Why it mattered</h3><p>'+e[5]+'</p></article><article><div class="tag">LOOK CLOSER</div><h3>What was happening?</h3><p>'+e[6]+'</p></article><article><div class="tag">WHAT CHANGED?</div><h3>Then → now</h3><p>'+e[7]+'</p></article></div><div class="evidence"><strong>Evidence / context</strong><p>'+e[6]+'</p><div class="note">Traditional accounts, cultural meaning and scientific evidence are kept separate. Desi Things is not medical advice.</div></div></div></section>'}
function add(){return '<section><div class="detail"><button class="back" onclick="location.hash=\'home\'">← Back</button><div class="eyebrow">PRESERVE</div><h2>What did someone in your family teach you?</h2><p class="lead">Tell it naturally. Future AI can structure the story without asking you to fill a research form.</p><form onsubmit="preview(event)"><div class="field"><label>Your memory</label><textarea id="memory" required placeholder="Example: My Aaji used to dry mango pieces on the terrace every summer..."></textarea></div><div class="field"><label>Where was your family from?</label><input id="place" placeholder="City, state, region or community"></div><button class="btn">Organise this memory →</button></form><div id="out"></div></div></section>'}
function preview(e){e.preventDefault();let p=document.getElementById('place').value||'Not specified';document.getElementById('out').innerHTML='<div class="ai"><div class="tag">AI INTAKE · CONCEPT PREVIEW</div><h3>We found these details</h3><div class="row"><span>Original story</span><strong>Preserved</strong></div><div class="row"><span>Region</span><strong>'+p.replace(/[<>]/g,'')+'</strong></div><div class="row"><span>Practice name</span><strong>Needs extraction</strong></div><div class="row"><span>Category</span><strong>Needs classification</strong></div><div class="row"><span>Claim / purpose</span><strong>Needs verification</strong></div><div class="row"><span>Evidence</span><strong>Not yet verified</strong></div><p class="note">Future AI extracts fields, flags medical/safety claims, suggests sources and asks for missing information. Nothing publishes automatically without review.</p></div>'}
function why(){return '<section><div class="detail"><button class="back" onclick="location.hash=\'home\'">← Back</button><div class="eyebrow">WHY THIS EXISTS</div><h2>Don't put Indian knowledge in a museum. Make it understandable again.</h2><p class="lead">Desi Things explores the reasoning hidden inside ordinary practices — without assuming that the past was always wiser or modern life is always better.</p><div class="story"><article><div class="tag">THE PRODUCT QUESTION</div><h3>What did we stop asking why about?</h3><p>Food, movement, body care, homes, rituals, community systems and the small instructions that travelled between generations.</p></article><article><div class="tag">THE RULE</div><h3>AI structures. People verify.</h3><p>Future contributors can speak or write naturally. AI can extract structure and flag claims, but evidence, safety and publication require review.</p></article></div></div></section>'}
function render(){let h=location.hash.slice(1)||'home';document.getElementById('app').innerHTML=h==='home'?home():h==='explore'?explore():h==='add'?add():h==='why'?why():h.startsWith('entry-')?entry(+h.split('-')[1]):home()}addEventListener('hashchange',render);render();
</script></body></html>
